spring.application.name=campushub

# JWT Configuration (JWT_SECRET was previously defined in .env but never
# actually wired up - JwtService had its own hardcoded secret instead)
jwt.secret=Vy26G64PYqTuTAM7NqBrc95sqc0A+2mIZQLklLi1vl4=

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/campushub

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8081

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

file.upload-dir=uploads/profile-pictures

# ==============================
# Email Configuration
# ==============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}